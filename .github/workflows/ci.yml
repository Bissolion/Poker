name: Testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Testes do motor
        run: npm test
      - name: Teste de fumaça no navegador
        run: npm run fumaca
      - name: Build sem mudanças pendentes
        run: git diff --exit-code -- mesa-de-treino.html docs
