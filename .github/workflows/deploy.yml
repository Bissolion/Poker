# Publica docs/ no GitHub Pages. Por enquanto só roda manualmente (aba Actions → Publicar → Run workflow).
# Para publicar a cada push na main, troque o bloco "on" por:
#   on:
#     push:
#       branches: [main]
# Antes, ative em Settings → Pages → Source: GitHub Actions (exige repositório público ou plano pago).
name: Publicar
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
